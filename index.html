<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Train">
<meta name="theme-color" content="#1a1a1a">
<title>Train</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://accounts.google.com/gsi/client" async defer onload="initGIS()"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f7f7f5;--surface:#ffffff;--surface2:#f0f0ed;
  --border:#e8e8e4;--border2:#d8d8d3;
  --text:#1a1a1a;--muted:#888;--dim:#bbb;
  --green:#16a34a;--green-bg:#f0fdf4;--green-border:#bbf7d0;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-border:#fde68a;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-border:#bfdbfe;
  --red:#dc2626;--red-bg:#fef2f2;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;overflow:hidden}
#app{height:100vh;height:-webkit-fill-available;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg)}

nav{display:flex;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;padding-top:env(safe-area-inset-top)}
nav button{flex:1;padding:14px 0;background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;position:relative;transition:color .2s}
nav button.active{color:var(--text)}
nav button.active::after{content:'';position:absolute;bottom:0;left:24px;right:24px;height:2px;background:var(--text);border-radius:2px 2px 0 0}

.page{display:none;flex:1;overflow-y:auto;padding:20px 16px 120px}
.page.active{display:block}

.date-header{margin-bottom:6px}
.date-header .day{font-size:24px;font-weight:600;letter-spacing:-.03em;color:var(--text)}
.date-header .sub{font-size:13px;color:var(--muted);margin-top:3px}

.phase-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:20px;font-size:11px;font-weight:500;color:var(--amber);margin:12px 0 16px}

.session-picker{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.sess-btn{padding:7px 14px;border:1.5px solid var(--border);border-radius:20px;background:var(--surface);color:var(--muted);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.sess-btn.active{border-color:var(--text);color:var(--text);background:var(--surface)}

.progress-wrap{margin-bottom:20px}
.progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.progress-meta span:last-child{font-weight:500;color:var(--text)}
.progress-bar{height:4px;background:var(--border);border-radius:4px}
.progress-fill{height:100%;background:var(--green);border-radius:4px;transition:width .4s ease}

.mobility-note{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.mobility-note .mob-title{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.mobility-note .mob-item{font-size:12px;color:var(--muted);padding:2px 0;line-height:1.5}

.section-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px 2px}

.exercise-list{display:flex;flex-direction:column;gap:6px}
.ex-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .15s}
.ex-item:has(.ex-check.done){border-color:var(--green-border);background:var(--green-bg)}
.ex-header{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.ex-check{width:22px;height:22px;border:1.5px solid var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;background:var(--surface)}
.ex-check.done{background:var(--green);border-color:var(--green)}
.ex-check svg{opacity:0;transition:opacity .15s}
.ex-check.done svg{opacity:1}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:600;color:var(--text)}
.ex-meta{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.ex-load{font-size:12px;font-weight:600;color:var(--blue);flex-shrink:0;background:var(--blue-bg);padding:3px 8px;border-radius:6px}

.ex-sets{padding:0 14px 12px 48px;display:none;gap:6px;flex-wrap:wrap}
.ex-sets.open{display:flex}
.set-btn{padding:6px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--muted);font-family:inherit;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s}
.set-btn.done{border-color:var(--green-border);color:var(--green);background:var(--green-bg)}

#btn-finish{width:100%;padding:16px;background:var(--text);color:#fff;border:none;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;flex-shrink:0;letter-spacing:-.01em;transition:all .2s;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#btn-finish:disabled{background:var(--border);color:var(--muted);cursor:default}
#btn-finish.ready{background:var(--green)}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 12px;text-align:center}
.stat-val{font-size:24px;font-weight:700;letter-spacing:-.03em;color:var(--text)}
.stat-label{font-size:10px;font-weight:500;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}

.log-entry{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;cursor:pointer}
.log-entry-header{padding:14px}
.log-date{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500;display:flex;align-items:center;gap:6px}
.log-session{font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.log-pct{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;flex-shrink:0}
.log-pct.full{background:var(--green-bg);color:var(--green)}
.log-pct.partial{background:var(--amber-bg);color:var(--amber)}
.log-exercises{display:flex;flex-direction:column;gap:4px;padding:0 14px 14px;border-top:1px solid var(--border)}
.log-ex{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:3px 0}
.log-ex span:last-child{font-weight:600}
.log-chevron{font-size:14px;color:var(--dim);margin-left:8px;transition:transform .2s;flex-shrink:0}
.log-chevron.open{transform:rotate(180deg)}
.cg-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:20px}
.cg-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;display:flex;justify-content:space-between}
.cg-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.cg-row:last-child{margin-bottom:0}
.cg-label{font-size:10px;color:var(--dim);width:40px;flex-shrink:0}
.cg-dot{width:20px;height:20px;border-radius:50%;background:var(--border2);flex-shrink:0;transition:background .2s}
.cg-dot.done{background:var(--green)}
.cg-dot.cur{background:var(--border);border:2px dashed var(--border2)}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;line-height:2}

.plan-phase{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin:24px 0 10px}
.plan-day-title{font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--text)}
.plan-ex{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:4px;font-size:12px;gap:8px}
.plan-ex span:first-child{color:var(--text);font-weight:500}
.plan-ex span:last-child{color:var(--muted);font-size:11px;text-align:right;flex-shrink:0}
.plan-tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.plan-tag.new{background:var(--blue-bg);color:var(--blue)}
.plan-tag.skill{background:var(--amber-bg);color:var(--amber)}
.ex-locked{opacity:.55}
.ex-load-tap{cursor:pointer;user-select:none}
.ex-load-tap::after{content:' ›';opacity:.5}
.prog-picker{padding:8px 14px 10px 14px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--border)}
.prog-rung{padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--muted);font-family:inherit;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s}
.prog-rung.active{border-color:var(--blue-border);color:var(--blue);background:var(--blue-bg)}

.action-btn{width:100%;padding:13px;background:var(--surface);border:1.5px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;border-radius:10px;cursor:pointer;margin-top:10px;transition:background .15s}
.action-btn:active{background:var(--bg)}
.phase-toggle{display:flex;gap:6px;margin-bottom:14px}
.phase-btn{flex:1;padding:9px 0;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center}
.phase-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
.next-badge{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--blue-bg);border:1px solid var(--blue-border);border-radius:10px;margin-bottom:14px;font-size:12px;color:var(--blue);font-weight:500}
.next-badge .nb-label{color:var(--muted);font-weight:400;margin-right:2px}

.prog-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}
.prog-card-title{font-size:13px;font-weight:700;margin-bottom:8px}
.prog-rule{font-size:12px;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--border);line-height:1.5}
.prog-rule:last-child{border-bottom:none}
.prog-rule strong{color:var(--text);font-weight:600}

.warmup-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:18px;overflow:hidden}
.warmup-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer}
.warmup-title{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.warmup-count{font-size:11px;color:var(--muted)}
.warmup-chevron{font-size:16px;color:var(--dim);transition:transform .2s}
.warmup-chevron.open{transform:rotate(180deg)}
.warmup-items{display:none;padding:0 14px 12px;flex-direction:column;gap:4px}
.warmup-items.open{display:flex}
.warmup-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer}
.warmup-item:last-child{border-bottom:none}
.warmup-check{width:18px;height:18px;border:1.5px solid var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;background:var(--bg)}
.warmup-check.done{background:var(--amber);border-color:var(--amber)}
.warmup-check svg{opacity:0;transition:opacity .15s}
.warmup-check.done svg{opacity:1}
.warmup-name{font-size:13px;color:var(--text)}
.warmup-note{font-size:11px;color:var(--muted);margin-top:1px}
@media print{
  body{background:#fff}nav,#btn-finish,.session-picker{display:none!important}
  .page{display:block!important;overflow:visible;padding:0}
  .ex-sets{display:flex!important}
  :root{--bg:#fff;--surface:#fff;--border:#e0e0e0;--border2:#ccc;--text:#000;--muted:#666;--amber:#b45309;--green:#15803d;--blue:#1d4ed8;--green-bg:#f7fff7;--blue-bg:#f0f4ff;--amber-bg:#fffbeb}
}
</style>
</head>
<body>
<input type="file" id="import-input" accept=".json" style="display:none">
<div id="app">
  <nav>
    <button class="active" onclick="showPage('today',this)">Today</button>
    <button onclick="showPage('log',this)">Log</button>
    <button onclick="showPage('plan',this)">Plan</button>
    <button onclick="showPage('settings',this)">Settings</button>
  </nav>
  <div id="today" class="page active"></div>
  <div id="log" class="page"></div>
  <div id="plan" class="page"></div>
  <div id="settings" class="page"></div>
  <button id="btn-finish" onclick="finishSession()" disabled>Start session to unlock</button>
</div>

        {name:'Wall handstand',meta:'3×20s · wrist must be 100%',load:'BW',sets:3,muscle:'shoulders',type:'skill',holdSec:20,wristGated:true},

        {name:'Aussie rows',meta:'3×12',load:'BW',sets:3,muscle:'back',type:'strength'},
        {name:'Push-ups',meta:'3×12',load:'BW',sets:3,muscle:'chest',type:'strength'},

const APP_VERSION='__COMMIT_SHA__';
let SHEETS_CLIENT_ID=localStorage.getItem('train_gid')||'';
let SHEETS_SPREADSHEET_ID=localStorage.getItem('train_gsid')||'';

const MOBILITY=['90/90 hip stretch — 2 min each side','Hamstring stretch (posterior pelvic tilt) — 2 min','Single-leg calf raise off step, 3 sec down — 3×15 each','Toe doming standing — 2 min','Thoracic rotation seated — 10 each side'];

const PROGRESSION=[

function getProgOptions(exName){
  if(PROG_MAP[exName]) return{options:PROG_MAP[exName].loads,type:'strength'};
  const sn=SKILL_EX_MAP[exName];
  if(sn){const sp=SKILL_PROGRESSIONS.find(s=>s.name===sn);if(sp) return{options:sp.rungs,type:'skill'};}
  return null;
}
function getProgLoad(exName,fallback){
  const p=getProgOptions(exName);if(!p) return fallback;
  const rung=progState[exName]||0;
  const val=p.options[Math.min(rung,p.options.length-1)];
  return p.type==='skill'?val.split(' — ')[0]:val;
}

function selectProgRung(name,idx){

const SHEET_HEADERS=['id','date','phase','session','completion_pct','duration_min','exercise','muscle','type','load','sets_completed','sets_target','warmup_completed','warmup_total'];

function sessionToRows(e){
  return e.exercises.map(ex=>[
    e.id,e.date,e.phase,e.session,e.completionPct,e.durationMin??'',
    ex.name,ex.muscle,ex.type,ex.load,ex.setsCompleted,ex.setsTarget,
    e.warmupCompleted??0,e.warmupTotal??0
  ]);
}

function rowsToSession(rows){
  const r=rows[0];
  const phase=PLAN[r[2]]?r[2]:'p1';
  return{
    id:Number(r[0]),date:r[1],phase,phaseLabel:PLAN[phase].label,session:r[3],
    completionPct:Number(r[4]),durationMin:r[5]?Number(r[5]):null,
    warmupCompleted:Number(r[12])||0,warmupTotal:Number(r[13])||0,
    totalSets:rows.reduce((a,x)=>a+Number(x[11]),0),
    completedSets:rows.reduce((a,x)=>a+Number(x[10]),0),
    exercises:rows.map(x=>({name:x[6],muscle:x[7],type:x[8],load:x[9],setsCompleted:Number(x[10]),setsTarget:Number(x[11])})),
    synced:true
  };
}

async function sheetsGet(range){
  const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_SPREADSHEET_ID}/values/${range}`,{headers:{Authorization:`Bearer ${gisToken}`}});
  return r.ok?r.json():null;
}

async function sheetsPut(range,values){
  const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_SPREADSHEET_ID}/values/${range}?valueInputOption=RAW`,{
    method:'PUT',headers:{Authorization:`Bearer ${gisToken}`,'Content-Type':'application/json'},
    body:JSON.stringify({values})
  });
  return r.ok;
}

async function sheetsAppend(rows){
  if(!gisToken||!SHEETS_SPREADSHEET_ID) return false;
  try{
    const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_SPREADSHEET_ID}/values/Log!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,{
      method:'POST',headers:{Authorization:`Bearer ${gisToken}`,'Content-Type':'application/json'},
      body:JSON.stringify({values:rows})
    });
    return r.ok;
  }catch{return false;}
}

async function ensureSheetHeaders(){
  try{
    const data=await sheetsGet('Log!A1');
    if(!data||(data.values??[])[0]?.[0]==='id') return;
    await sheetsPut('Log!A1',[SHEET_HEADERS]);
  }catch{}
}

async function pullFromSheets(){
  if(!gisToken||!SHEETS_SPREADSHEET_ID) return;
  try{
    const data=await sheetsGet('Log!A:N');
    if(!data) return;
    const rows=(data.values??[]).slice(1).filter(r=>r.length>=12);
    const grouped={};
    rows.forEach(row=>{grouped[row[0]]??=[];grouped[row[0]].push(row);});
    const sheetIds=new Set(Object.keys(grouped).map(Number));
    const cutoff=Date.now()-28*24*60*60*1000;
    let log=JSON.parse(localStorage.getItem('train_log')||'[]');
    log=log.filter(e=>!e.synced||sheetIds.has(e.id)||new Date(e.date).getTime()<=cutoff);
    const localIds=new Set(log.map(e=>e.id));
    Object.values(grouped).forEach(sessionRows=>{
      const entry=rowsToSession(sessionRows);
      if(!localIds.has(entry.id)&&new Date(entry.date).getTime()>cutoff){log.push(entry);}
    });
    log.sort((a,b)=>b.id-a.id);
    localStorage.setItem('train_log',JSON.stringify(log));
  }catch{}
}

function initGIS(){
  if(!SHEETS_CLIENT_ID||!window.google) return;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:SHEETS_CLIENT_ID,
    scope:'https://www.googleapis.com/auth/spreadsheets',
    callback:async(resp)=>{
      if(resp.error) return;
      gisToken=resp.access_token;
      localStorage.setItem('train_signin','1');
      await ensureSheetHeaders();
      await pullFromSheets();
      renderLog();renderSettings();
    }
  });
  if(localStorage.getItem('train_signin')==='1') tokenClient.requestAccessToken({prompt:''});
}

function signIn(){if(tokenClient) tokenClient.requestAccessToken({prompt:''})}
function signOut(){
  if(gisToken) google.accounts.oauth2.revoke(gisToken);
  gisToken=null;
  localStorage.removeItem('train_signin');
  renderLog();renderSettings();
}

let syncing=false;
async function syncUnsynced(){
  if(!gisToken){signIn();return;}
  syncing=true;renderLog();
  await pullFromSheets();
  const log=JSON.parse(localStorage.getItem('train_log')||'[]');
  const pending=log.filter(e=>!e.synced);
  for(const entry of pending){
    const ok=await sheetsAppend(sessionToRows(entry));
    if(ok) entry.synced=true;
  }
  localStorage.setItem('train_log',JSON.stringify(log));
  syncing=false;renderLog();
}

function switchPhase(p){currentPhase=p;const sessions=Object.keys(PLAN[p].sessions);currentSession=sessions[0];setsDone={};warmupDone={};sessionStart=null;editingLogId=null;save();renderToday()}

function getSuggestedSession(){
  const log=JSON.parse(localStorage.getItem('train_log')||'[]');
  const phaseSessions=Object.keys(PLAN[currentPhase].sessions);
  if(!log.length) return phaseSessions[0];
  const lastInPhase=log.find(e=>e.phase===currentPhase);
  if(!lastInPhase) return phaseSessions[0];
  const lastIdx=phaseSessions.indexOf(lastInPhase.session);
  if(lastIdx===-1) return phaseSessions[0];
  return phaseSessions[(lastIdx+1)%phaseSessions.length];
}

function toggleSets(i){document.getElementById('sets-'+i).classList.toggle('open')}

function handleSetClick(exIdx,setIdx,btn,holdSec){
  if(btn.classList.contains('done')){toggleSet(exIdx,setIdx,btn);btn.textContent='hold '+holdSec+'s';return}
  if(activeTimer&&activeTimer.exIdx===exIdx&&activeTimer.setIdx===setIdx){
    clearInterval(activeTimer.interval);activeTimer=null;
    btn.textContent='hold '+holdSec+'s';return;
  }
  if(activeTimer){
    clearInterval(activeTimer.interval);
    const prev=document.getElementById('stbtn-'+activeTimer.exIdx+'-'+activeTimer.setIdx);
    const prevEx=PLAN[currentPhase].sessions[currentSession][activeTimer.exIdx];
    if(prev&&!prev.classList.contains('done')) prev.textContent='hold '+(prevEx.holdSec)+'s';
    activeTimer=null;
  }
  let remaining=holdSec;
  btn.textContent=remaining+'s';
  const interval=setInterval(()=>{
    remaining--;
    const b=document.getElementById('stbtn-'+exIdx+'-'+setIdx);
    if(!b){clearInterval(interval);activeTimer=null;return}
    if(remaining<=0){
      clearInterval(interval);activeTimer=null;
      toggleSet(exIdx,setIdx,b);
      b.textContent='set '+(setIdx+1);
    } else {
      b.textContent=remaining+'s';
    }
  },1000);
  activeTimer={exIdx,setIdx,interval};
}

function unlockWrist(){
  wristUnlocked=!wristUnlocked;
  localStorage.setItem('train_wrist',JSON.stringify(wristUnlocked));
  renderToday();

function toggleSet(exIdx,setIdx,btn){
  if(!setsDone[exIdx]) setsDone[exIdx]=[];
  if(!sessionStart) sessionStart=new Date().toISOString();
  setsDone[exIdx][setIdx]=!setsDone[exIdx][setIdx];
  btn.classList.toggle('done',setsDone[exIdx][setIdx]);
  const ex=PLAN[currentPhase].sessions[currentSession][exIdx];
  const done=setsDone[exIdx].filter(Boolean).length===ex.sets;
  document.getElementById('chk-'+exIdx).classList.toggle('done',done);
  const totalSets=PLAN[currentPhase].sessions[currentSession].reduce((a,e)=>a+e.sets,0);
  const doneSets=Object.values(setsDone).flat().filter(Boolean).length;
  const pct=Math.round(doneSets/totalSets*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  updateFinishBtn();
}

function updateFinishBtn(){
  const exercises=PLAN[currentPhase].sessions[currentSession];
  const totalSets=exercises.reduce((a,e)=>a+e.sets,0);
  const doneSets=Object.values(setsDone).flat().filter(Boolean).length;
  const btn=document.getElementById('btn-finish');
  const pct=Math.round(doneSets/totalSets*100);
  if(editingLogId){btn.disabled=false;btn.classList.add('ready');btn.textContent=`Save edits (${pct}%)`;return}
  if(doneSets===0){btn.disabled=true;btn.textContent='Start session to unlock';btn.classList.remove('ready');return}
  btn.disabled=doneSets<totalSets*0.5;
  btn.classList.toggle('ready',doneSets>=totalSets*0.5);
  btn.textContent=doneSets===totalSets?'Complete — save session ✓':`Save session (${pct}% done)`;
}

function finishSession(){
  const exercises=PLAN[currentPhase].sessions[currentSession];
  const log=JSON.parse(localStorage.getItem('train_log')||'[]');
  if(editingLogId){
    const idx=log.findIndex(e=>e.id===editingLogId);
    if(idx!==-1){
      const orig=log[idx];
      orig.exercises=exercises.map((ex,i)=>({name:ex.name,muscle:ex.muscle,type:ex.type,load:ex.load,setsTarget:ex.sets,setsCompleted:(setsDone[i]||[]).filter(Boolean).length}));
      orig.completedSets=Object.values(setsDone).flat().filter(Boolean).length;
      orig.totalSets=exercises.reduce((a,e)=>a+e.sets,0);
      orig.completionPct=Math.round(orig.completedSets/orig.totalSets*100);
      orig.synced=false;
      localStorage.setItem('train_log',JSON.stringify(log));
    }
    editingLogId=null;setsDone={};sessionStart=null;
    renderToday();renderLog();
    showPage('log',document.querySelectorAll('nav button')[1]);
    return;
  }
  const endTime=new Date().toISOString();
  const durationMin=sessionStart?Math.round((new Date(endTime)-new Date(sessionStart))/60000):null;
  const entry={
    id:Date.now(),date:endTime,sessionStart,durationMin,
    phase:currentPhase,phaseLabel:PLAN[currentPhase].label,session:currentSession,
    warmupCompleted:Object.values(warmupDone).filter(Boolean).length,warmupTotal:(currentPhase==='p1'?WARMUP_P1:WARMUP_P2).length,
    exercises:exercises.map((ex,i)=>({name:ex.name,muscle:ex.muscle,type:ex.type,load:ex.load,setsTarget:ex.sets,setsCompleted:(setsDone[i]||[]).filter(Boolean).length})),
    totalSets:exercises.reduce((a,e)=>a+e.sets,0),
    completedSets:Object.values(setsDone).flat().filter(Boolean).length,
    completionPct:Math.round(Object.values(setsDone).flat().filter(Boolean).length/exercises.reduce((a,e)=>a+e.sets,0)*100)
  };
  entry.synced=false;
  log.unshift(entry);
  localStorage.setItem('train_log',JSON.stringify(log));
  if(gisToken) sheetsAppend(sessionToRows(entry)).then(ok=>{
    if(!ok) return;
    const l=JSON.parse(localStorage.getItem('train_log')||'[]');
    const i=l.findIndex(e=>e.id===entry.id);
    if(i!==-1){l[i].synced=true;localStorage.setItem('train_log',JSON.stringify(l));}
  });
  setsDone={};sessionStart=null;
  renderToday();renderLog();
  showPage('log',document.querySelectorAll('nav button')[1]);
}

function loadSessionFromLog(id){
  const log=JSON.parse(localStorage.getItem('train_log')||'[]');
  const entry=log.find(e=>e.id===id);
  if(!entry) return;
  const phase=PLAN[entry.phase]?entry.phase:Object.keys(PLAN).find(k=>PLAN[k].label===entry.phaseLabel)||Object.keys(PLAN)[0];
  const session=PLAN[phase].sessions[entry.session]?entry.session:Object.keys(PLAN[phase].sessions)[0];
  editingLogId=id;
  currentPhase=phase;
  currentSession=session;
  warmupDone={};
  sessionStart=null;
  setsDone={};
  entry.exercises.forEach((ex,i)=>{
    if(ex.setsCompleted>0){
      setsDone[i]=Array.from({length:ex.setsTarget},(_,s)=>s<ex.setsCompleted);
    }
  });
  save();
  renderToday();
  showPage('today',document.querySelectorAll('nav button')[0]);
}

function cancelEditSession(){
  editingLogId=null;setsDone={};sessionStart=null;
  renderToday();
  showPage('log',document.querySelectorAll('nav button')[1]);
}

function getMondayKey(date){
  const d=new Date(date);const day=d.getDay();
  d.setDate(d.getDate()-(day===0?6:day-1));
  return d.toISOString().slice(0,10);
}
function buildWeekGrid(log,weeks=12){
  const wmap={};
  log.forEach(e=>{const k=getMondayKey(e.date);wmap[k]=(wmap[k]||0)+1;});
  const rows=[];const now=new Date();
  for(let i=weeks-1;i>=0;i--){
    const d=new Date(now);d.setDate(now.getDate()-i*7);
    const k=getMondayKey(d);
    const label=d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
    rows.push({key:k,label,count:Math.min(wmap[k]||0,3),isCurrent:i===0});
  }
  return rows;
}
function calcStreak(log){
  const wmap={};
  log.forEach(e=>{const k=getMondayKey(e.date);wmap[k]=(wmap[k]||0)+1;});
  const curKey=getMondayKey(new Date());
  let streak=0;const now=new Date();
  for(let i=1;i<=52;i++){
    const d=new Date(now);d.setDate(now.getDate()-i*7);
    const k=getMondayKey(d);
    if((wmap[k]||0)>=3) streak++;
    else break;
  }
  if((wmap[curKey]||0)>=3) streak++;
  return streak;
}
function toggleLogEntry(id){
  if(expandedEntries.has(id)) expandedEntries.delete(id);
  else expandedEntries.add(id);
  renderLog();
}

function renderLog(){
  const log=JSON.parse(localStorage.getItem('train_log')||'[]');
  const el=document.getElementById('log');
  const sheetsEnabled=!!SHEETS_CLIENT_ID;
  const unsyncedCount=log.filter(e=>!e.synced).length;
  if(!log.length){
    let empty='<div class="empty-state">No sessions logged yet.<br>Complete your first workout.</div>';
    if(sheetsEnabled) empty+=`<button class="action-btn" onclick="${gisToken?'syncUnsynced()':'signIn()'}">Connect Google Sheets</button>`;
    el.innerHTML=empty;return;
  }
  const avgCompletion=Math.round(log.reduce((a,e)=>a+e.completionPct,0)/log.length);
  const streak=calcStreak(log);
  let html=`<div class="stat-row">
    <div class="stat"><div class="stat-val">${log.length}</div><div class="stat-label">sessions</div></div>
    <div class="stat"><div class="stat-val">${streak}</div><div class="stat-label">wk streak</div></div>
    <div class="stat"><div class="stat-val">${avgCompletion}%</div><div class="stat-label">avg done</div></div>
  </div>`;
  if(sheetsEnabled){
    if(gisToken){
      html+=`<div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="action-btn" style="margin-top:0;flex:1" onclick="syncUnsynced()" ${syncing?'disabled':''}>
          ${syncing?'Syncing…':unsyncedCount>0?'Sync '+unsyncedCount+' unsynced':'Synced ✓'}
        </button>
        <button onclick="signOut()" style="padding:13px 14px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0">Disconnect</button>
      </div>`;
    } else {
      html+=`<button class="action-btn" style="margin-bottom:14px" onclick="signIn()">Connect Google Sheets</button>`;
    }
  }
  const grid=buildWeekGrid(log);
  html+=`<div class="cg-wrap">
    <div class="cg-title"><span>Consistency · last 12 weeks</span><span style="color:var(--text)">${calcStreak(log)} week streak</span></div>
    ${grid.map(w=>`<div class="cg-row">
      <span class="cg-label">${w.label}</span>
      ${[0,1,2].map(i=>`<span class="cg-dot${w.isCurrent&&i>=w.count?' cur':i<w.count?' done':''}"></span>`).join('')}
    </div>`).join('')}
  </div>`;

  log.forEach(entry=>{
    const d=new Date(entry.date);
    const dateStr=d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
    const timeStr=d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
    const full=entry.completionPct===100;
    const expanded=expandedEntries.has(entry.id);
    const syncDot=sheetsEnabled&&!entry.synced?'<span style="width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block"></span>':'';
    const durBadge=entry.durationMin?`<span style="background:var(--surface2);color:var(--muted);font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px">${entry.durationMin} min</span>`:'';
    html+=`<div class="log-entry" onclick="toggleLogEntry(${entry.id})">
      <div class="log-entry-header">
        <div class="log-date">${dateStr} · ${timeStr} ${durBadge} ${syncDot}</div>
        <div class="log-session">${entry.session} · ${entry.phaseLabel}
          <div style="display:flex;align-items:center;gap:6px">
            <span class="log-pct ${full?'full':'partial'}">${entry.completionPct}%</span>
            <button onclick="event.stopPropagation();loadSessionFromLog(${entry.id})" style="font-size:11px;font-weight:600;color:var(--blue);background:var(--blue-bg);border:1px solid var(--blue-border);border-radius:6px;padding:3px 8px;cursor:pointer;font-family:inherit">Edit</button>
            <span class="log-chevron${expanded?' open':''}">⌄</span>
          </div>
        </div>
      </div>`;
    if(expanded){
      html+=`<div class="log-exercises">`;
      entry.exercises.forEach(ex=>{
        const done=ex.setsCompleted===ex.setsTarget;
        html+=`<div class="log-ex"><span>${ex.name}<span style="color:var(--dim);font-size:10px;margin-left:6px">${ex.load}</span></span><span style="color:${done?'var(--green)':'var(--amber)'}">${ex.setsCompleted}/${ex.setsTarget}</span></div>`;
      });
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  html+=`<button class="action-btn" onclick="exportCSV()">Export as CSV</button>
  <button class="action-btn" onclick="exportJSON()">Export backup (JSON)</button>
  <button class="action-btn" onclick="document.getElementById('import-input').click()">Import backup (JSON)</button>`;
  el.innerHTML=html;
}

function exportCSV(){
  const log=JSON.parse(localStorage.getItem('train_log')||'[]');
  if(!log.length) return;
  const rows=[['date','phase','session','exercise','muscle','type','load','sets_completed','sets_target','completion_pct','duration_min']];
  log.forEach(entry=>{entry.exercises.forEach(ex=>{rows.push([new Date(entry.date).toLocaleDateString('en-AU'),entry.phaseLabel,entry.session,ex.name,ex.muscle,ex.type,ex.load,ex.setsCompleted,ex.setsTarget,entry.completionPct,entry.durationMin||''])})});
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='train_log.csv';a.click();URL.revokeObjectURL(url);
}

function saveSettings(){
  const cid=document.getElementById('inp-cid').value.trim();
  const sid=document.getElementById('inp-sid').value.trim();
  SHEETS_CLIENT_ID=cid;
  SHEETS_SPREADSHEET_ID=sid;
  localStorage.setItem('train_gid',cid);
  localStorage.setItem('train_gsid',sid);
  gisToken=null;
  tokenClient=null;
  initGIS();
  renderSettings();
}

function renderSettings(){
  const connected=!!gisToken;
  const configured=!!(SHEETS_CLIENT_ID&&SHEETS_SPREADSHEET_ID);
  document.getElementById('settings').innerHTML=`
    <div class="date-header" style="margin-bottom:20px"><div class="day">Settings</div></div>
    <div class="section-label">Google Sheets sync</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
      <div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500">OAuth Client ID</div>
        <input id="inp-cid" type="text" value="${SHEETS_CLIENT_ID}" placeholder="xxxx.apps.googleusercontent.com"
          style="width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:12px;background:var(--surface);color:var(--text);outline:none">
      </div>
      <div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500">Spreadsheet ID</div>
        <input id="inp-sid" type="text" value="${SHEETS_SPREADSHEET_ID}" placeholder="from the sheet URL"
          style="width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:12px;background:var(--surface);color:var(--text);outline:none">
      </div>
    </div>
    <button class="action-btn" onclick="saveSettings()" style="margin-bottom:10px">Save</button>
    ${configured?`<button class="action-btn" onclick="${connected?'signOut()':'signIn()'}">${connected?'Disconnect Google account':'Connect Google account'}</button>`:''}
    ${configured&&connected?`<p style="font-size:12px;color:var(--green);margin-top:10px;text-align:center">Connected ✓</p>`:''}
    ${configured&&!connected?`<p style="font-size:12px;color:var(--muted);margin-top:10px;text-align:center">Credentials saved — tap Connect to sign in</p>`:''}
    <p style="font-size:11px;color:var(--dim);margin-top:24px;text-align:center;font-family:monospace">${APP_VERSION}</p>
  `;
}

function renderPlan(){
  let html='';
  Object.entries(PLAN).forEach(([key,phase])=>{
    html+=`<div class="plan-phase">${phase.label} · ${phase.sub}</div>`;
    Object.entries(phase.sessions).forEach(([day,exercises])=>{
      html+=`<div class="plan-day-title">${day}</div>`;
      let lastSec='';
      exercises.forEach(ex=>{
        if(ex.section&&ex.section!==lastSec){html+=`<div class="section-label" style="margin-top:10px">${ex.section}</div>`;lastSec=ex.section}
        html+=`<div class="plan-ex"><span>${ex.name}${ex.note==='new'?'<span class="plan-tag new">new</span>':''}</span><span>${ex.meta} · ${ex.load}</span></div>`;
      });
    });
  });
  html+=`<div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border)">
    <div class="plan-phase">Daily mobility · every day</div>
    ${MOBILITY.map(m=>`<div class="plan-ex"><span>${m}</span><span>10 min total</span></div>`).join('')}
  </div>
  <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border)">
    <div class="plan-phase">Strength progressions</div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6">Hit the trigger for 2 sessions in a row → move up one rung.</p>
    ${PROGRESSION.map(p=>{const rung=progState[p.name]||0;return`<div class="prog-card"><div class="prog-card-title">${p.name}</div><div class="prog-rule">${p.loads.map((l,i)=>`<span style="color:${i===rung?'var(--blue)':'var(--muted)'};font-weight:${i===rung?'700':'400'}">${l}</span>`).join(' → ')}</div><div class="prog-rule">Trigger: <strong>${p.trigger}</strong></div></div>`}).join('')}
  </div>
  <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border)">
    <div class="plan-phase">Skill progressions · 8-week base build</div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6">Never to failure — stop 2s before form breaks. Advance rung when target is clean for 2 sessions in a row.</p>
    ${SKILL_PROGRESSIONS.map(sp=>{
      const exName=Object.keys(SKILL_EX_MAP).find(k=>SKILL_EX_MAP[k]===sp.name);
      const rung=exName?(progState[exName]||0):0;
      return`<div class="prog-card"><div class="prog-card-title">${sp.name}${sp.gated?'<span style="font-size:10px;color:var(--amber);margin-left:6px">🔒 wrist-gated</span>':''}</div>${sp.rungs.map((r,i)=>`<div class="prog-rule" style="color:${i===rung?'var(--blue)':'inherit'};font-weight:${i===rung?'600':'400'}"><strong>${i+1}.</strong> ${r}</div>`).join('')}</div>`;
    }).join('')}
  </div>
  <button class="action-btn" onclick="window.print()">Print full plan</button>`;
  document.getElementById('plan').innerHTML=html;
}

function showPage(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  document.getElementById('btn-finish').style.display=id==='today'?'block':'none';
}

function selectSession(s){currentSession=s;setsDone={};warmupDone={};sessionStart=null;editingLogId=null;save();renderToday()}

function exportJSON(){
  const data={state:JSON.parse(localStorage.getItem('train_state')||'{}'),log:JSON.parse(localStorage.getItem('train_log')||'[]'),exported:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='train_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);
}

document.getElementById('import-input').addEventListener('change',function(e){
  const file=e.target.files[0];if(!file)return;
  if(!confirm('This will replace all current data. Continue?')){this.value='';return;}
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(data.log) localStorage.setItem('train_log',JSON.stringify(data.log));
      if(data.state){
        localStorage.setItem('train_state',JSON.stringify(data.state));
        currentPhase=data.state.phase||'p1';
        currentSession=data.state.session||'Monday';
      }
      setsDone={};warmupDone={};sessionStart=null;
      renderToday();renderLog();renderPlan();
      alert('Backup restored successfully.');
    }catch(err){alert('Invalid backup file.');}
  };
  reader.readAsText(file);
  this.value='';
});

renderToday();renderLog();renderPlan();renderSettings();
document.getElementById('btn-finish').style.display='block';
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
